<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | WiserPicture</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#F9F9F6;color:#1A1C1B;font-family:Manrope,sans-serif;text-align:center;padding:24px}
    .logo{height:56px;width:auto;margin-bottom:40px}
    .code{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.2em;color:#C9A84C;font-size:.85rem;margin:0 0 12px}
    h1{font-family:Lora,serif;font-style:italic;font-weight:400;color:#334F2B;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.2;margin:0 0 16px;max-width:620px}
    p{max-width:460px;line-height:1.7;margin:0 auto 32px;color:#6B705C}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    a.btn{display:inline-block;padding:12px 24px;border-radius:.5rem;text-decoration:none;font-weight:600}
    a.primary{background:#334F2B;color:#fff}
    a.primary:hover{background:#2A3F22}
    a.ghost{border:1px solid #C8C8C5;color:#334F2B}
    a.ghost:hover{border-color:#334F2B}
  </style>
</head>
<body>
  <a href="/"><img class="logo" src="/assets/Wiserpicure%20Logo.png" alt="WiserPicture" /></a>
  <p class="code">ERROR 404</p>
  <h1>Esta página se fue de vacaciones… y sin presupuesto.</h1>
  <p>No encontramos lo que buscabas. Pero el que busca encuentra: aquí tienes un buen lugar para empezar.</p>
  <div class="actions">
    <a class="btn primary" href="/">Ir al inicio</a>
    <a class="btn ghost" href="/podcast">Escuchar el podcast</a>
    <a class="btn ghost" href="/blog">Leer el blog</a>
  </div>
</body>
</html>
